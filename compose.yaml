# docker compose up -d   →  https://$MYCLOUD_DOMAIN with automatic Let's Encrypt certificates.
# Create your account:    docker compose exec mycloud node mycloud.js adduser <name>
x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  pids_limit: 256

services:
  mycloud:
    <<: *hardening
    build: .
    environment:
      MYCLOUD_PUBLIC_URL: https://${MYCLOUD_DOMAIN:?set MYCLOUD_DOMAIN, e.g. cloud.example.com}
      MYCLOUD_TRUST_PROXY: "1" # Caddy below is the one proxy in front
      MYCLOUD_THUMBNAILER_URL: http://thumbnailer:8081
    volumes:
      - mycloud-data:/data
    tmpfs: [/tmp]
    mem_limit: 1g
    networks: [web, thumbs]
    # Only reachable through Caddy; nothing is published on the host.
    expose: ["8080"]

  # Media parsers run here, not next to your data: no volumes, no internet, one file at a time.
  thumbnailer:
    <<: *hardening
    build: .
    command: ["thumbnailer", "--port", "8081"]
    # One job at a time; inputs are capped at MYCLOUD_THUMBNAIL_MAX_MB (default 384). tmpfs counts against memory,
    # so the input cap + converter limits (ImageMagick 256 MiB) stay below mem_limit.
    tmpfs: ["/tmp:size=448m"]
    mem_limit: 1g
    networks: [thumbs]

  caddy:
    <<: *hardening
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443"]
    # Caddy replaces X-Forwarded-For with the real peer, which MyCloud (--trust-proxy) relies on.
    command: caddy reverse-proxy --from ${MYCLOUD_DOMAIN} --to mycloud:8080
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    mem_limit: 256m
    networks: [web]

networks:
  web:
  thumbs:
    internal: true # no route to the internet

volumes:
  mycloud-data:
  caddy-data:
  caddy-config:
